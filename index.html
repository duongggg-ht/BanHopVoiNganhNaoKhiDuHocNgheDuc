    function landing(){app.innerHTML=`<div class="shell">${header('16 câu hỏi')}</div><main class="shell landing"><section class="landing-copy"><div class="eyebrow">Career route / 01</div><h1>Bạn hợp<br><span class="accent">nhóm ngành</span><br>nào tại Đức?</h1><p class="muted">Quiz giúp bạn hiểu nhóm ngành phù hợp trước khi chọn chương trình du học nghề Đức.</p><button class="btn" onclick="discover()">Chọn nghề đúng trước khi chọn đi Đức →</button><p class="muted" style="font-size:12px;margin-top:28px">✓ 16 câu hỏi &nbsp;&nbsp; ✓ Kết quả theo 6 nhóm ngành &nbsp;&nbsp; ✓ Có bản đồ lộ trình sau THPT</p></section><section class="map"><div class="map-label">FIND YOUR DIRECTION</div><div class="map-note">Hiểu mình<br>trước khi<br>chọn nghề.</div><div class="destinations">6 DESTINATIONS<div class="dots"><span>C</span><span>T</span><span>F</span><span>S</span><span>B</span><span>P</span></div></div></section></main><section class="shell" style="padding-bottom:60px"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px"><div class="panel"><b>01 / Hiểu mình</b><p class="muted" style="font-size:13px">Nhìn rõ cách bạn muốn tạo ra giá trị.</p></div><div class="panel"><b>02 / Khám phá nhóm ngành</b><p class="muted" style="font-size:13px">Xem các nghề cụ thể để đối chiếu.</p></div><div class="panel"><b>03 / Vẽ lộ trình</b><p class="muted" style="font-size:13px">Biết bước tiếp theo sau THPT.</p></div></div></section></main><section class="shell" style="padding:64px 0"><div style="display:flex;justify-content:space-between;gap:22px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:22px"><div><div class="eyebrow">06 DESTINATIONS / GERMANY</div><h2>Một bản đồ nghề, sáu hướng đi.</h2></div><p class="muted" style="max-width:340px;font-size:14px">Quiz giúp bạn xác định nhóm ngành nổi trội trước khi khám phá nghề cụ thể.</p></div><div class="group-map-grid">${Object.entries(groups).map(([code,g],i)=>`<article class="group-destination"><span class="group-code">${code}</span><small>DESTINATION 0${i+1}</small><h3>${g.name}</h3><p class="muted" style="font-size:13px">${g.desc}</p><strong>${g.jobs.slice(0,2).map(j=>j.name).join(' · ')}</strong></article>`).join('')}</div></section>
`}
    function discover(){app.innerHTML=`<div class="shell">${header('Career map / 02')}</div><main class="shell discover-page"><section><div class="eyebrow">02 / DISCOVER</div><h1>Không có câu trả lời đúng.<br><span class="accent">Chỉ có câu trả lời phù hợp với bạn.</span></h1><p class="muted">16 câu hỏi ngắn giúp soi chiếu cách bạn tư duy, làm việc và tạo ra giá trị — trước khi bạn chọn một hướng đi tại Đức.</p><div class="discover-stats"><div><b>16</b><span>CÂU HỎI</span></div><div><b>04</b><span>LỚP KHÁM PHÁ</span></div><div><b>06</b><span>ĐIỂM ĐẾN</span></div></div><button class="btn" onclick="showLead()">Khám phá hướng đi →</button><button class="text-btn" onclick="landing()">Quay lại</button></section><section class="route-board"><div class="route-line r1"></div><div class="route-line r2"></div><div class="route-line r3"></div><span class="route-node n1">YOU</span><span class="route-node n2">01</span><span class="route-node n3">DESTINATION</span><div class="route-copy"><div class="eyebrow">CAREER ROUTE</div><h2>Hiểu mình.<br>Khám phá.<br>Chọn hướng.</h2></div></section></main>`;
}
    function showLead(){app.innerHTML=`<div class="shell">${header('Before your route')}</div><main class="shell form-page"><div class="form-grid"><section><div class="eyebrow">Trước khi bắt đầu</div><h1>Để kết quả<br><span class="accent">dành riêng</span><br>cho bạn.</h1><p class="muted">Điền thông tin để chúng tôi ghi nhận kết quả quiz và giúp bạn tiếp tục tìm hiểu lộ trình du học nghề Đức phù hợp.</p><p style="border-left:2px solid var(--red);padding-left:14px;color:#8b8184;font-size:13px;line-height:1.7">Thông tin của bạn chỉ được dùng cho trải nghiệm tư vấn quiz này.</p></section><section class="panel"><div style="border-bottom:1px solid var(--line);padding-bottom:18px"><div class="eyebrow">Thông tin liên hệ</div><h2>Bắt đầu hành trình</h2></div><form id="leadForm"><label class="field"><span>Họ tên *</span><input id="name" placeholder="Nguyễn Văn A" required></label><label class="field"><span>Số điện thoại *</span><input id="phone" type="tel" placeholder="09xx xxx xxx" required></label><label class="field"><span>Email *</span><input id="email" type="email" placeholder="ban@example.com" required></label><label class="field"><span>Mối quan tâm chính *</span><select id="interest" required><option value="">Chọn mối quan tâm</option><option>Chưa biết mình hợp ngành nào</option><option>Muốn tìm hiểu ngành cụ thể</option><option>Quan tâm học tiếng Đức</option><option>Quan tâm chi phí</option><option>Quan tâm hồ sơ/visa</option><option>Quan tâm cơ hội việc làm</option></select></label><label class="field"><span>Thời điểm sẵn sàng du học *</span><select id="timing" required><option value="">Chọn thời điểm</option><option>Chưa xác định</option><option>Trong 12 tháng tới</option><option>Trong 6–12 tháng</option><option>Trong 3–6 tháng</option><option>Tôi muốn được tư vấn sớm</option></select></label><label style="display:flex;gap:9px;align-items:flex-start;color:#6f676b;font-size:12px;line-height:1.5"><input id="consent" type="checkbox" required style="margin-top:3px;accent-color:var(--red)"><span>Tôi đồng ý để Phuong Nam Education liên hệ tư vấn về kết quả quiz và lộ trình du học nghề Đức.</span></label><div class="form-actions"><button type="button" class="btn secondary" onclick="landing()">Quay lại</button><button class="btn">Bắt đầu quiz →</button></div></form></section></div></main>`;document.getElementById('leadForm').onsubmit=e=>{e.preventDefault();const phone=document.getElementById('phone').value.replace(/[(). -]/g,'');if(!/^\+?(84|0)\d{8,10}$/.test(phone)){alert('Vui lòng nhập số điện thoại hợp lệ.');return}lead={name:document.getElementById('name').value.trim(),phone,email:document.getElementById('email').value.trim(),interest:document.getElementById('interest').value,timing:document.getElementById('timing').value};current=0;answers=[];quiz()}}
    function quiz(){const q=questions[current];const pct=(current/questions.length)*100;app.innerHTML=`<div class="shell">${header('Câu '+String(current+1).padStart(2,'0')+' / 16')}</div><main class="shell quiz-page"><div class="progress-head"><div><div class="eyebrow">${q[0].includes('Công việc A')?'Lựa chọn thực tế':'Career fit'}</div><div class="progress"><i style="width:${pct}%"></i></div></div><span class="muted" style="font-size:12px">${current+1} / ${questions.length}</span></div><div class="question-wrap"><div class="question-number">Câu hỏi ${String(current+1).padStart(2,'0')}</div><div class="prompt">${q[0]}</div><div class="answers">${q[1].map((answer,i)=>`<button class="answer ${selected===i?'selected':''}" onclick="choose(${i})"><b>${String.fromCharCode(65+i)}</b><span>${answer}</span></button>`).join('')}</div><div class="quiz-actions"><button class="btn secondary" onclick="${current?'previous()':'showLead()'}">← Quay lại</button><button class="btn" ${selected===null?'disabled':''} onclick="next()">${current===questions.length-1?'Xem kết quả':'Tiếp tục'} →</button></div></div></main>`}
    function choose(i){selected=i;quiz()}
    function previous(){if(current>0){current--;selected=answers[current]??null;quiz()}else showLead()}
    function next(){if(selected===null)return;answers[current]=selected;if(current<questions.length-1){current++;selected=answers[current]??null;quiz()}else { app.innerHTML=`<main class="shell profile-analysis"><section><div class="eyebrow" style="justify-content:center">04 / YOUR PROFILE</div><h1>Your profile<br><span class="accent">is being drawn.</span></h1><p class="muted">Chúng tôi đang kết nối các lựa chọn của bạn thành một bản đồ nghề riêng.</p><div class="analysis-route"><div><span>✓</span>Định hướng</div><div><span>✓</span>Phong cách</div><div><span>✓</span>Đặc thù</div><div><span>✓</span>Thực tế</div></div></section></main>`;setTimeout(result,1800)}}
    function result(){const score={C:0,T:0,F:0,S:0,B:0,P:0};answers.forEach((answer,i)=>{const code=questions[i][2][answer];score[code]+=i<4?1.25:i<8?1:i<12?1.25:1.5});const ranking=Object.entries(score).sort((a,b)=>b[1]-a[1]);const winner=ranking[0][0],group=groups[winner],max=ranking[0][1]||1;app.innerHTML=`<div class="shell">${header('Kết quả FIT')}</div><main class="shell result-page"><section class="result-hero"><div class="result-lead"><div class="eyebrow" style="color:#f4a6ad">Kết quả nổi trội · ${winner}</div><h1>${group.name}</h1><div class="fit-score">FIT: ${Math.round(ranking[0][1]/max*100)}/100</div><p style="margin-top:12px">${group.desc}</p><div style="margin-top:30px;border-top:1px solid #ffffff26;padding-top:18px;color:#b92334;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase">Các nghề thuộc nhóm</div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">${group.jobs.map(j=>`<span style="border:1px solid #ffffff33;padding:8px 10px;font-size:12px">${j.name}</span>`).join('')}</div></div><div class="score-panel"><div class="eyebrow">Bản đồ điểm FIT</div><h2>Nhóm ngành phù hợp</h2>${ranking.map(([code,value])=>`<div class="score-row"><div class="score-label"><span>${groups[code].name}</span><span>${Math.round(value/max*100)}%</span></div><div class="bar"><i style="width:${Math.max(5,value/max*100)}%;background:${groups[code].color}"></i></div></div>`).join('')}<div style="margin-top:20px;padding:14px;background:var(--soft);border-left:2px solid var(--red)"><b style="font-size:12px;color:#8f1d2c">Reality check</b><p class="muted" style="font-size:12px;margin:5px 0">Kết quả chỉ định hướng nhóm ngành. Hãy đối chiếu nghề cụ thể với năng lực, tiếng Đức, sức khỏe và hoàn cảnh của bạn.</p></div><p class="muted" style="font-size:12px;margin-top:15px">${lead?.name||'Bạn'}, đây là điểm xuất phát để bạn chọn bước tư vấn tiếp theo.</p></div></section><section style="margin-top:58px"><div class="eyebrow">02 / BẢN ĐỒ ĐIỂM ĐÁNH GIÁ ĐỘ PHÙ HỢP</div><h2>Điều gì tạo nên kết quả của bạn?</h2><div class="dimension-grid">${dimensionsByGroup[winner].map(([label,value],i)=>`<div class="dimension-card ${i<3?"top":""}"><b>${label}</b><small>${value}%</small><div class="dimension-bar"><i style="width:${value}%"></i></div></div>`).join("")}</div></section><div class="section-head"><div><div class="eyebrow">03 / CHỌN NGHỀ ĐỂ TÌM HIỂU SÂU HƠN</div><h2>Chọn nghề để tìm hiểu sâu hơn</h2></div><span class="muted" style="font-size:12px"></span></div><section class="occupation-grid">${group.jobs.map((job,i)=>`<article class="occupation"><div class="eyebrow">0${i+1} / Nghề cụ thể</div><h3>${job.name}</h3><div class="detail"><label>• Công việc chính</label><p>${job.work}</p></div><div class="detail"><label>• Môi trường làm việc</label><p>${job.env}</p></div><div class="detail"><label>• Kỹ năng nổi bật</label><div class="chips">${job.skills.map(s=>`<span class="chip">${s}</span>`).join('')}</div></div><div class="detail"><label>• Yêu cầu tiếng Đức</label><p>${job.de}</p></div><div class="detail"><label>• Cơ hội nghề nghiệp</label><p>${job.opp}</p></div><div class="detail"><label>• Lộ trình đào tạo</label><p>A1 (08 tuần) → A2 (08 tuần) → B1 (10 tuần) → B2 (12 tuần)</p></div><button class="btn secondary" style="margin-top:10px" onclick="openOccupationByName('\${job.name}')">Tìm hiểu ngành này →</button></article>`).join('')}</section><section class="path"><div class="eyebrow">YOUR GERMANY PATH</div><h2>Từ nhóm ngành phù hợp đến kế hoạch du học nghề Đức.</h2><p class="muted">Kết quả FIT chỉ là điểm bắt đầu. Hãy đi tiếp bằng cách khám phá nghề cụ thể và đối chiếu yêu cầu của chương trình.</p><div class="path-grid">${pathSteps.map(s=>`<div class="step"><strong>${s[0]}</strong><h3>${s[1]}</h3><p>${s[2]}</p></div>`).join('')}</div><div class="cta"><div><h3>Sẵn sàng chọn hướng đi?</h3><p class="muted" style="margin:5px 0 0;font-size:13px">Liên hệ với Phuong Nam Education để được tư vấn chuyên sâu 1:1 miễn phí.</p></div><button class="btn">Liên hệ tư vấn 1:1</button></div></section></main>`}
    landing();
  </script>
<div id="occupation-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="occupation-modal-title"><div class="modal-box"><button class="modal-close" aria-label="Đóng thông tin nghề">×</button><div class="eyebrow">Destination / Nghề cụ thể</div><h2 id="occupation-modal-title"></h2><div id="occupation-modal-content"></div><button class="btn modal-dismiss">Đóng thông tin →</button></div></div><script>function openOccupationByName(name){const job=[...Object.values(groups)].flatMap(g=>g.jobs).find(j=>j.name===name);if(!job)return;const modal=document.getElementById('occupation-modal'),content=document.getElementById('occupation-modal-content');document.getElementById('occupation-modal-title').textContent=job.name;content.innerHTML='<div class="modal-grid"><div><b>• CÔNG VIỆC CHÍNH</b><p>'+job.work+'</p></div><div><b>• MÔI TRƯỜNG LÀM VIỆC</b><p>'+job.env+'</p></div><div><b>• KỸ NĂNG NỔI BẬT</b><p>'+job.skills.join(' · ')+'</p></div><div><b>• YÊU CẦU TIẾNG ĐỨC</b><p>'+job.de+'</p></div><div><b>• LỘ TRÌNH ĐÀO TẠO</b><p>A1 (08 tuần) → A2 (08 tuần) → B1 (10 tuần) → B2 (12 tuần)</p></div><div><b>• CƠ HỘI NGHỀ NGHIỆP</b><p>'+job.opp+'</p></div></div>';modal.hidden=false;document.body.classList.add('modal-open');document.querySelector('.modal-close').focus()}function closeOccupation(){document.getElementById('occupation-modal').hidden=true;document.body.classList.remove('modal-open')}document.querySelector('.modal-close').onclick=closeOccupation;document.querySelector('.modal-dismiss').onclick=closeOccupation;document.getElementById('occupation-modal').onclick=e=>{if(e.target.id==='occupation-modal')closeOccupation()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOccupation()});</script></body>
