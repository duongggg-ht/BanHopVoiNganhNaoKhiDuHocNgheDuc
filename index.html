    const groups={C:{name:'Chăm sóc – Sức khỏe',desc:'Dành cho người muốn tạo giá trị bằng sự chăm sóc, trách nhiệm và tác động tích cực đến con người.',color:'#D92D3F',jobs:[{name:'Điều dưỡng',work:'Chăm sóc, theo dõi và hỗ trợ người bệnh trong sinh hoạt và quá trình điều trị.',env:'Bệnh viện, viện dưỡng lão, cơ sở chăm sóc hoặc trung tâm y tế.',skills:['Trách nhiệm','Chính xác','Kiên nhẫn','Giao tiếp'],de:'Thường cần B2.',opp:'Nhu cầu nhân lực ổn định và cơ hội làm việc dài hạn tại Đức.'},{name:'Trợ lý nha khoa',work:'Hỗ trợ nha sĩ, chuẩn bị dụng cụ và chăm sóc quy trình tiếp đón bệnh nhân.',env:'Phòng khám nha khoa và trung tâm y tế.',skills:['Cẩn thận','Tổ chức','Giao tiếp','Vệ sinh'],de:'Thường cần B1–B2.',opp:'Có thể phát triển trong phòng khám và nha khoa.'}]},T:{name:'Kỹ thuật – Cơ khí',desc:'Dành cho người thích máy móc, tư duy logic và tạo ra kết quả bằng độ chính xác kỹ thuật.',color:'#2B3340',jobs:[{name:'Cơ khí chính xác',work:'Gia công, lắp ráp và kiểm tra các chi tiết kỹ thuật theo bản vẽ và tiêu chuẩn.',env:'Xưởng cơ khí, nhà máy sản xuất và phòng kiểm định.',skills:['Đo lường','Đọc bản vẽ','Chính xác','Xử lý lỗi'],de:'Thường hướng tới B1–B2.',opp:'Cơ hội trong sản xuất công nghiệp, tự động hóa và bảo trì.'},{name:'Cơ khí ô tô',work:'Kiểm tra, bảo dưỡng, sửa chữa và chẩn đoán hệ thống trên phương tiện.',env:'Gara, đại lý ô tô và xưởng dịch vụ.',skills:['Kỹ thuật','Chẩn đoán','Thực hành','An toàn'],de:'Thường hướng tới B1–B2.',opp:'Phát triển tại xưởng dịch vụ và ngành ô tô.'}]},F:{name:'Ẩm thực – Sản xuất thực phẩm',desc:'Dành cho người thích làm việc thực hành, tạo ra sản phẩm hữu hình và chinh phục nhịp độ nhanh.',color:'#C65A2E',jobs:[{name:'Đầu bếp',work:'Chuẩn bị nguyên liệu, chế biến món ăn và duy trì tiêu chuẩn chất lượng trong bếp.',env:'Nhà hàng, khách sạn, bếp ăn tập thể và khu nghỉ dưỡng.',skills:['Thực hành','Quản lý thời gian','Vệ sinh','Sáng tạo'],de:'Thường cần A2–B1.',opp:'Cơ hội tại nhà hàng, khách sạn và hệ thống ẩm thực.'},{name:'Làm bánh',work:'Chuẩn bị nguyên liệu, tạo hình và hoàn thiện bánh theo công thức và tiêu chuẩn.',env:'Tiệm bánh, khách sạn và xưởng sản xuất thực phẩm.',skills:['Khéo léo','Chính xác','Thẩm mỹ','Kỷ luật'],de:'Thường cần A2–B1.',opp:'Có thể phát triển trong tiệm bánh, khách sạn hoặc sản xuất.'}]},S:{name:'Dịch vụ – Vận hành',desc:'Dành cho người giỏi tổ chức, linh hoạt và muốn giữ cho dịch vụ hoặc quy trình vận hành thông suốt.',color:'#B8781F',jobs:[{name:'Logistics',work:'Theo dõi hàng hóa, điều phối đơn hàng và phối hợp các mắt xích vận chuyển.',env:'Kho vận, trung tâm logistics và văn phòng điều phối.',skills:['Tổ chức','Đúng giờ','Phối hợp','Xử lý sự cố'],de:'Thường cần A2–B1.',opp:'Nhu cầu tốt trong chuỗi cung ứng, kho vận và vận tải.'},{name:'Nhà hàng – khách sạn',work:'Đón tiếp, phục vụ khách và đảm bảo trải nghiệm dịch vụ đúng tiêu chuẩn.',env:'Nhà hàng, khách sạn, khu nghỉ dưỡng và sự kiện.',skills:['Giao tiếp','Linh hoạt','Dịch vụ','Chịu áp lực'],de:'Thường cần B1–B2.',opp:'Có thể phát triển trong khách sạn, nhà hàng và du lịch.'}]},B:{name:'Bán lẻ – Kinh doanh – Văn phòng',desc:'Dành cho người có năng lượng từ giao tiếp, tư vấn và kết nối nhu cầu với giải pháp phù hợp.',color:'#6F4C92',jobs:[{name:'Nhân viên bán hàng',work:'Tư vấn sản phẩm, hỗ trợ khách hàng và hoàn tất giao dịch tại điểm bán.',env:'Cửa hàng, showroom, siêu thị và trung tâm thương mại.',skills:['Giao tiếp','Tư vấn','Thuyết phục','Dịch vụ'],de:'Thường cần B1–B2.',opp:'Cơ hội trong bán lẻ, thương mại và chăm sóc khách hàng.'},{name:'Nhân viên kinh doanh',work:'Tìm hiểu nhu cầu, giới thiệu giải pháp và duy trì quan hệ với khách hàng.',env:'Văn phòng, thị trường, showroom hoặc môi trường kinh doanh.',skills:['Đặt câu hỏi','Thuyết phục','Mục tiêu','Xử lý thông tin'],de:'Thường cần B1–B2.',opp:'Có thể phát triển lên tư vấn, account hoặc quản lý kinh doanh.'}]},P:{name:'Thủ công – Dịch vụ cá nhân',desc:'Dành cho người thích làm bằng tay, tạo ra kết quả thẩm mỹ và cá nhân hóa cho từng khách hàng.',color:'#4D7C70',jobs:[{name:'Cắt tóc',work:'Tư vấn kiểu tóc, thực hiện kỹ thuật cắt và tạo kiểu phù hợp với từng khách hàng.',env:'Salon, studio làm đẹp và không gian dịch vụ cá nhân.',skills:['Khéo léo','Thẩm mỹ','Cá nhân hóa','Giao tiếp'],de:'Thường cần A2–B1.',opp:'Có thể phát triển trong salon, studio hoặc dịch vụ riêng.'},{name:'Thợ cắm hoa',work:'Thiết kế và hoàn thiện sản phẩm hoa theo dịp, không gian và yêu cầu khách hàng.',env:'Cửa hàng hoa, studio, sự kiện và xưởng thủ công.',skills:['Sáng tạo','Thẩm mỹ','Khéo léo','Tư vấn'],de:'Thường cần A2–B1.',opp:'Cơ hội trong cửa hàng hoa, sự kiện và trang trí.'}]}};
    const questions=[
      ['Trong công việc, điều gì khiến bạn cảm thấy mình đang tạo ra giá trị rõ ràng nhất?',['Giúp một người được chăm sóc hoặc hỗ trợ.','Giải quyết vấn đề để máy móc hoặc hệ thống hoạt động tốt hơn.','Tạo ra một sản phẩm cụ thể đạt chất lượng.','Đảm bảo dịch vụ hoặc hoạt động đúng kế hoạch.','Giúp khách hàng lựa chọn và hoàn tất công việc.','Dùng kỹ năng cá nhân tạo ra sản phẩm mang dấu ấn riêng.'],['C','T','F','S','B','P']],
      ['Bạn thích nhìn thấy kết quả công việc của mình dưới dạng nào nhất?',['Một người cảm thấy tốt hơn.','Một thiết bị hoạt động chính xác.','Một món ăn hoặc sản phẩm hoàn chỉnh.','Một chuyến đi, đơn hàng hoàn thành đúng thời gian.','Một khách hàng giải quyết được nhu cầu.','Một sản phẩm có tính thẩm mỹ và cá nhân hóa.'],['C','T','F','S','B','P']],
      ['Nếu được lựa chọn một loại vấn đề để dành thời gian giải quyết, bạn nghiêng về:',['Một người đang cần được hỗ trợ.','Một thiết bị đang gặp lỗi.','Một sản phẩm cần hoàn thiện.','Một quy trình gặp trục trặc.','Một khách hàng chưa tìm được lựa chọn phù hợp.','Một sản phẩm chưa đạt phong cách mong muốn.'],['C','T','F','S','B','P']],
      ['Nếu được trải nghiệm thử một công việc trong một ngày, bạn tò mò nhất về:',['Chăm sóc và hỗ trợ một người.','Lắp ráp, vận hành một thiết bị.','Chế biến món ăn hoặc thực phẩm.','Điều phối, giao nhận hoặc vận hành.','Tư vấn và làm việc trực tiếp với khách hàng.','Cắt tóc, cắm hoa hoặc làm thủ công.'],['C','T','F','S','B','P']],
      ['Khi học một kỹ năng mới, cách nào phù hợp nhất?',['Được hướng dẫn từng bước rồi thực hành.','Hiểu nguyên lý trước rồi tự tìm cách làm.','Quan sát mẫu rồi trực tiếp thực hành.','Bắt đầu làm và điều chỉnh theo thực tế.'],['T','B','P','S']],
      ['Bạn được giao công việc có nhiều cách thực hiện. Bạn thường:',['Chọn quy trình rõ ràng, ít rủi ro.','Phân tích rồi tìm cách hiệu quả hơn.','Chọn cách tạo ra chất lượng tốt nhất.','Linh hoạt thay đổi theo tình huống.'],['C','T','F','S']],
      ['Bạn cảm thấy thế nào với công việc phải đứng, di chuyển hoặc thao tác bằng tay?',['Rất phù hợp.','Khá phù hợp.','Có thể làm nhưng không ưu tiên.','Tôi thích công việc ít vận động hơn.'],['F','T','S','B']],
      ['Nếu phải làm một công việc tương tự nhiều lần, điều nào đúng với bạn?',['Ổn nếu lần nào cũng đúng tiêu chuẩn.','Tôi thích cải thiện để nhanh và hiệu quả hơn.','Tôi cần có sự thay đổi để duy trì hứng thú.','Tôi thích mỗi khách hàng hoặc tình huống khác nhau.'],['C','T','P','B']],
      ['Nếu công việc yêu cầu chịu trách nhiệm trực tiếp cho sức khỏe người khác, bạn cảm thấy:',['Tôi sẵn sàng đảm nhận.','Có thể nếu được đào tạo và có quy trình rõ.','Tôi sẽ khá áp lực.','Tôi không muốn trách nhiệm như vậy.'],['C','C','S','T']],
      ['Nếu công việc yêu cầu kiểm tra một chi tiết nhiều lần để không sai sót, bạn:',['Thấy hoàn toàn bình thường.','Có thể làm tốt nếu tiêu chuẩn rõ.','Làm được nhưng không thích quá tỉ mỉ.','Rất khó chịu với kiểu công việc này.'],['T','C','S','B']],
      ['Bạn cảm thấy thế nào với môi trường nhịp độ nhanh, nhiều việc trong thời gian ngắn?',['Tôi thích môi trường như vậy.','Tôi có thể thích nghi tốt.','Tôi thích nhịp ổn định hơn.','Tôi không phù hợp áp lực thời gian liên tục.'],['S','B','C','T']],
      ['Nếu phần lớn công việc yêu cầu giao tiếp trực tiếp, bạn:',['Càng giao tiếp nhiều càng có năng lượng.','Thích giao tiếp gắn với tư vấn nhu cầu.','Có thể giao tiếp nhưng không muốn là phần chính.','Thích tập trung vào sản phẩm, máy móc hoặc quy trình.'],['B','C','S','T']],
      ['Phát hiện vấn đề khiến kết quả có nguy cơ không đạt, bạn ưu tiên:',['Kiểm tra từng bước để xác định vấn đề.','Tìm nguyên nhân và thử cách xử lý khác.','Trao đổi với người liên quan trước.','Tìm phương án nhanh nhất.'],['T','B','C','S']],
      ['Một khách hàng không hài lòng và yêu cầu xử lý ngay. Bạn làm gì trước?',['Lắng nghe để hiểu vấn đề.','Kiểm tra quy trình xử lý.','Tìm phương án nhanh nhất.','Tìm hiểu nhu cầu để đưa lựa chọn phù hợp.'],['C','T','S','B']],
      ['Đang làm việc thực hành và kết quả chưa đạt, bạn sẽ:',['Làm lại theo tiêu chuẩn và kiểm tra từng bước.','Tìm nguyên nhân để điều chỉnh kỹ thuật.','Thử cách khác để cải thiện sản phẩm.','Hỏi người có kinh nghiệm.'],['T','B','F','C']],
      ['Bạn có hai lựa chọn công việc với mức thu nhập và cơ hội phát triển tương đương:\n\nCông việc A: Quy trình rõ ràng, yêu cầu độ chính xác cao, kết quả phụ thuộc nhiều vào kỹ năng chuyên môn.\n\nCông việc B: Thường xuyên thay đổi theo khách hàng và tình huống, cần giao tiếp và ứng biến.\n\nBạn nghiêng về:',['Rất rõ ràng về A.','Hơi nghiêng về A.','Hơi nghiêng về B.','Rất rõ ràng về B.'],['T','C','S','B']]
    ];
    const pathSteps=[['01','Xác định hướng ngành','Từ kết quả FIT, chọn nhóm ngành phù hợp để tìm hiểu sâu hơn.'],['02','Khám phá ngành nghề','Xem các nghề cụ thể thuộc nhóm đã chọn.'],['03','Đối chiếu yêu cầu','Kiểm tra yêu cầu của ngành/chương trình đang quan tâm.'],['04','Chuẩn bị tiếng Đức & kỹ năng','Xây dựng năng lực ngôn ngữ và kỹ năng cần thiết.'],['05','Chuẩn bị hồ sơ','Tìm hiểu và chuẩn bị hồ sơ theo chương trình phù hợp.'],['06','Sẵn sàng cho lộ trình sang Đức','Hoàn thiện các bước cần thiết theo chương trình đã lựa chọn.']];
    let lead=null, current=0, answers=[], selected=null;
    const app=document.getElementById('app');
    const header=(right='')=>`<header class="topbar"><div class="brand"><div class="mark">Q</div><div><strong>Bản đồ nghề</strong><small>PNE · GERMANY</small></div></div><div class="muted" style="font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase">${right}</div></header>`;
    function landing(){app.innerHTML=`<div class="shell">${header('16 câu hỏi · khoảng 5 phút')}</div><main class="shell landing"><section class="landing-copy"><div class="eyebrow">Career route / 01</div><h1>Bạn hợp<br><span class="accent">nhóm ngành</span><br>nào tại Đức?</h1><p class="muted">Một quiz định hướng để nhìn rõ cách bạn muốn tạo ra giá trị – từ đó tìm thấy nhóm nghề phù hợp hơn sau THPT.</p><button class="btn" onclick="showLead()">Bắt đầu khám phá →</button><p class="muted" style="font-size:12px;margin-top:28px">✓ Không có đáp án đúng/sai &nbsp;&nbsp; ✓ Kết quả theo 6 nhóm ngành</p></section><section class="map"><div class="map-label">FIND YOUR DIRECTION</div><div class="map-note">Hiểu mình<br>trước khi<br>chọn nghề.</div><div class="destinations">6 DESTINATIONS<div class="dots"><span>C</span><span>T</span><span>F</span><span>S</span><span>B</span><span>P</span></div></div></section></main>`}
    function showLead(){app.innerHTML=`<div class="shell">${header('Before your route')}</div><main class="shell form-page"><div class="form-grid"><section><div class="eyebrow">Trước khi bắt đầu</div><h1>Để kết quả<br><span class="accent">dành riêng</span><br>cho bạn.</h1><p class="muted">Điền thông tin để chúng tôi ghi nhận kết quả quiz và giúp bạn tiếp tục tìm hiểu lộ trình du học nghề Đức phù hợp.</p><p style="border-left:2px solid var(--red);padding-left:14px;color:#8b8184;font-size:13px;line-height:1.7">Thông tin của bạn chỉ được dùng cho trải nghiệm tư vấn quiz này.</p></section><section class="panel"><div style="border-bottom:1px solid var(--line);padding-bottom:18px"><div class="eyebrow">Thông tin liên hệ</div><h2>Bắt đầu hành trình</h2></div><form id="leadForm"><label class="field"><span>Họ tên *</span><input id="name" placeholder="Nguyễn Văn A" required></label><label class="field"><span>Số điện thoại *</span><input id="phone" type="tel" placeholder="09xx xxx xxx" required></label><label class="field"><span>Email *</span><input id="email" type="email" placeholder="ban@example.com" required></label><div class="form-actions"><button type="button" class="btn secondary" onclick="landing()">Quay lại</button><button class="btn">Bắt đầu quiz →</button></div></form></section></div></main>`;document.getElementById('leadForm').onsubmit=e=>{e.preventDefault();const phone=document.getElementById('phone').value.replace(/[(). -]/g,'');if(!/^\+?(84|0)\d{8,10}$/.test(phone)){alert('Vui lòng nhập số điện thoại hợp lệ.');return}lead={name:document.getElementById('name').value.trim(),phone,email:document.getElementById('email').value.trim()};current=0;answers=[];quiz()}}
    function quiz(){const q=questions[current];const pct=(current/questions.length)*100;app.innerHTML=`<div class="shell">${header('Câu '+String(current+1).padStart(2,'0')+' / 16')}</div><main class="shell quiz-page"><div class="progress-head"><div><div class="eyebrow">${q[0].includes('Công việc A')?'Lựa chọn thực tế':'Career fit'}</div><div class="progress"><i style="width:${pct}%"></i></div></div><span class="muted" style="font-size:12px">${current+1} / ${questions.length}</span></div><div class="question-wrap"><div class="question-number">Câu hỏi ${String(current+1).padStart(2,'0')}</div><div class="prompt">${q[0]}</div><div class="answers">${q[1].map((answer,i)=>`<button class="answer ${selected===i?'selected':''}" onclick="choose(${i})"><b>${String.fromCharCode(65+i)}</b><span>${answer}</span></button>`).join('')}</div><div class="quiz-actions"><button class="btn secondary" onclick="${current?'previous()':'showLead()'}">← Quay lại</button><button class="btn" ${selected===null?'disabled':''} onclick="next()">${current===questions.length-1?'Xem kết quả':'Tiếp tục'} →</button></div></div></main>`}
    function choose(i){selected=i;quiz()}
    function previous(){if(current>0){current--;selected=answers[current]??null;quiz()}else showLead()}
    function next(){if(selected===null)return;answers[current]=selected;if(current<questions.length-1){current++;selected=answers[current]??null;quiz()}else result()}
    function result(){const score={C:0,T:0,F:0,S:0,B:0,P:0};answers.forEach((answer,i)=>{const code=questions[i][2][answer];score[code]+=i<4?1.25:i<8?1:i<12?1.25:1.5});const ranking=Object.entries(score).sort((a,b)=>b[1]-a[1]);const winner=ranking[0][0],group=groups[winner],max=ranking[0][1]||1;app.innerHTML=`<div class="shell">${header('Kết quả FIT')}</div><main class="shell result-page"><section class="result-hero"><div class="result-lead"><div class="eyebrow" style="color:#f4a6ad">Kết quả nổi trội · ${winner}</div><h1>${group.name}</h1><p>${group.desc}</p><div style="margin-top:30px;border-top:1px solid #ffffff26;padding-top:18px;color:#f4a6ad;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase">Các nghề thuộc nhóm</div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">${group.jobs.map(j=>`<span style="border:1px solid #ffffff33;padding:8px 10px;font-size:12px">${j.name}</span>`).join('')}</div></div><div class="score-panel"><div class="eyebrow">Bản đồ điểm FIT</div><h2>Nhóm ngành phù hợp</h2>${ranking.map(([code,value])=>`<div class="score-row"><div class="score-label"><span>${groups[code].name}</span><span>${Math.round(value/max*100)}%</span></div><div class="bar"><i style="width:${Math.max(5,value/max*100)}%;background:${groups[code].color}"></i></div></div>`).join('')}<p class="muted" style="font-size:12px;margin-top:20px">${lead?.name||'Bạn'}, quiz xác định nhóm ngành phù hợp. Hãy tiếp tục đối chiếu từng nghề cụ thể trước khi chọn chương trình.</p></div></section><div class="section-head"><div><div class="eyebrow">Chi tiết nghề thuộc nhóm ${winner}</div><h2>Chọn nghề để tìm hiểu sâu hơn</h2></div><span class="muted" style="font-size:12px">${group.jobs.length} nghề tiêu biểu</span></div><section class="occupation-grid">${group.jobs.map((job,i)=>`<article class="occupation"><div class="eyebrow">0${i+1} / Nghề cụ thể</div><h3>${job.name}</h3><div class="detail"><label>→ Công việc chính</label><p>${job.work}</p></div><div class="detail"><label>→ Môi trường làm việc</label><p>${job.env}</p></div><div class="detail"><label>→ Kỹ năng nổi bật</label><div class="chips">${job.skills.map(s=>`<span class="chip">${s}</span>`).join('')}</div></div><div class="detail"><label>→ Yêu cầu tiếng Đức</label><p>${job.de}</p></div><div class="detail"><label>→ Cơ hội nghề nghiệp</label><p>${job.opp}</p></div><button class="btn secondary" style="margin-top:10px">Tìm hiểu ngành này →</button></article>`).join('')}</section><section class="path"><div class="eyebrow">YOUR GERMANY PATH</div><h2>Từ nhóm ngành phù hợp đến kế hoạch du học nghề Đức.</h2><p class="muted">Kết quả FIT chỉ là điểm bắt đầu. Hãy đi tiếp bằng cách khám phá nghề cụ thể và đối chiếu yêu cầu của chương trình.</p><div class="path-grid">${pathSteps.map(s=>`<div class="step"><strong>BƯỚC ${s[0]}</strong><h3>${s[1]}</h3><p>${s[2]}</p></div>`).join('')}</div><div class="cta"><div><h3>Sẵn sàng chọn hướng đi?</h3><p class="muted" style="margin:5px 0 0;font-size:13px">Liên hệ với Phuong Nam Education để được tư vấn chuyên sâu 1:1 miễn phí.</p></div><button class="btn">Liên hệ tư vấn 1:1</button></div></section></main>`}
    landing();
  </script>
</body>
</html>
